apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubepulse-ingress
  namespace: kubepulse
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: kubepulse.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubepulse-sample-service
                port:
                  number: 80
