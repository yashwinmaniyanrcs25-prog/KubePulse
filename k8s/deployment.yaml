apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubepulse-sample
  namespace: kubepulse
  labels:
    app: kubepulse-demo
    tier: microservice
    app.kubernetes.io/name: kubepulse-sample
    app.kubernetes.io/component: demo-workload
    app.kubernetes.io/part-of: devops-hackathon
spec:
  # Initial replica requirement: exactly 1 replica initially (scaled to 3 in Test B)
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: kubepulse-demo
  template:
    metadata:
      labels:
        app: kubepulse-demo
        tier: microservice
        version: v1.0.0
    spec:
      containers:
        - name: kubepulse-sample
          image: kubepulse-sample:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: APP_VERSION
              value: "v1.0.0"
            # Kubernetes Downward API: Expose pod identity safely to the container
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # Startup probe: gives the container up to 30s to boot without premature kill
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          # Readiness probe: determines if the pod should receive service traffic
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          # Liveness probe: detects deadlocked/failed process and triggers container restart
          livenessProbe:
            httpGet:
              path: /live
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
