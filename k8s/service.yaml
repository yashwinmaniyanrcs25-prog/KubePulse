apiVersion: v1
kind: Service
metadata:
  name: kubepulse-sample-service
  namespace: kubepulse
  labels:
    app: kubepulse-demo
    tier: microservice
    app.kubernetes.io/name: kubepulse-sample-service
spec:
  type: ClusterIP
  selector:
    app: kubepulse-demo
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
