apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubepulse-dashboard-role
  namespace: kubepulse
rules:
  # Deployment read and scale operations
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
  # Pod inspection and targeted deletion for self-healing demonstration
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  # Service inspection
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  # Cluster events viewing
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
